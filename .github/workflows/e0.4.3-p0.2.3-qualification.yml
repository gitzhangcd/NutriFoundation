name: E0.4.3 P0.2.3 Eligible Pool Qualification

on:
  push:
    branches:
      - e0.4.3-batch002-independent-gold
    paths:
      - 'scripts/paper_c/p0_2_3_qualify.py'
      - '.github/workflows/e0.4.3-p0.2.3-qualification.yml'
      - 'runs/E0.4.3/P0.2.2/Gold100_Candidate_Source_Registry_RAW_v0.1.json'
      - 'runs/E0.4.3/P0.2.3/Gold100_Candidate_Source_Registry_Coverage_Repair_v0.1.json'
      - 'runs/E0.4.3/P0.2.3/Gold100_Candidate_Source_Registry_Coverage_Repair_v0.2.json'

permissions:
  contents: write
  actions: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Cancel stale P0.2.3 qualification runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for status in in_progress queued; do
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/e0.4.3-p0.2.3-qualification.yml/runs?status=$status&per_page=50" \
            | jq -r '.workflow_runs[].id' \
            | while read id; do
                if [ "$id" != "${GITHUB_RUN_ID}" ]; then
                  curl -fsSL -X POST \
                    -H "Authorization: Bearer $GH_TOKEN" \
                    -H "Accept: application/vnd.github+json" \
                    "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/$id/cancel" >/dev/null || true
                fi
              done
          done
      - uses: actions/checkout@v4
        with:
          ref: e0.4.3-batch002-independent-gold
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run P0.2.3 qualification
        run: python scripts/paper_c/p0_2_3_qualify.py
      - name: Commit qualification outputs
        run: |
          git config user.name "NutriFoundation Qualification Bot"
          git config user.email "actions@users.noreply.github.com"
          git add runs/E0.4.3/P0.2.3
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data(E0.4.3-P0.2.3): qualify and freeze eligible pool [skip ci]"
            git push origin HEAD:e0.4.3-batch002-independent-gold
          fi
