name: E0.4.3 P0.2.4 Deterministic Gold100 Selection

on:
  push:
    branches:
      - e0.4.3-batch002-independent-gold
    paths:
      - 'scripts/paper_c/p0_2_4_select.py'
      - '.github/workflows/e0.4.3-p0.2.4-selection.yml'
      - 'runs/E0.4.3/P0.2.4/PreSampling_Source_Universe_Amendment_v1.0.json'
      - 'runs/E0.4.3/P0.2.4/PreSampling_Feasibility_Amendment_v1.1.json'
      - 'paper_c/P0.2.4/Paper_C_P0_PreSampling_Feasibility_Erratum_v0.1.1.md'

permissions:
  contents: write

concurrency:
  group: e0.4.3-p0.2.4-selection
  cancel-in-progress: true

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e0.4.3-batch002-independent-gold
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic solver
        run: python -m pip install --disable-pip-version-check ortools==9.14.6206
      - name: Run deterministic Gold100 selection
        run: python scripts/paper_c/p0_2_4_select.py
      - name: Commit selection outputs
        run: |
          git config user.name "NutriFoundation Selection Bot"
          git config user.email "actions@users.noreply.github.com"
          git add runs/E0.4.3/P0.2.4
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data(E0.4.3-P0.2.4): freeze deterministic Gold100 source set [skip ci]"
            git push origin HEAD:e0.4.3-batch002-independent-gold
          fi
