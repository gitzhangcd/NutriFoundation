name: E0.4.3 P0.3 Calibration24 Selection

on:
  push:
    branches:
      - e0.4.3-batch002-independent-gold
    paths:
      - 'scripts/paper_c/p0_3_select_calibration.py'
      - '.github/workflows/e0.4.3-p0.3-calibration-selection.yml'

permissions:
  contents: write

concurrency:
  group: e0.4.3-p0.3-calibration-selection
  cancel-in-progress: true

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e0.4.3-batch002-independent-gold
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic solver
        run: python -m pip install --disable-pip-version-check ortools==9.14.6206
      - name: Select leakage-safe Calibration24
        run: python scripts/paper_c/p0_3_select_calibration.py
      - name: Commit calibration selection outputs
        run: |
          git config user.name "NutriFoundation Calibration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add runs/E0.4.3/P0.3
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data(E0.4.3-P0.3): freeze leakage-safe Calibration24 [skip ci]"
            git fetch origin e0.4.3-batch002-independent-gold
            git rebase origin/e0.4.3-batch002-independent-gold
            git push origin HEAD:e0.4.3-batch002-independent-gold
          fi
