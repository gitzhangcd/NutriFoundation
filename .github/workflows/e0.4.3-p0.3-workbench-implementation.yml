name: E0.4.3 P0.3 Workbench Implementation Acceptance

on:
  push:
    branches:
      - e0.4.3-batch002-independent-gold
    paths:
      - 'src/nutrifoundation/workbench/**'
      - 'paper_c/P0.3/workbench/**'
      - 'tests/test_p0_3_workbench.py'
      - 'scripts/paper_c/p0_3_workbench_acceptance.py'
      - '.github/workflows/e0.4.3-p0.3-workbench-implementation.yml'
      - 'runs/E0.4.3/P0.3/Calibration12A_Training_Manifest_v1.0.json'
      - 'runs/E0.4.3/P0.3/Calibration12B_Reliability_Manifest_v1.0.json'

permissions:
  contents: write

concurrency:
  group: e0.4.3-p0.3-workbench-implementation
  cancel-in-progress: true

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e0.4.3-batch002-independent-gold
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install engine and test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Run P0.3 workbench implementation tests
        run: pytest -q tests/test_p0_3_workbench.py
      - name: Freeze automated implementation acceptance report
        run: python scripts/paper_c/p0_3_workbench_acceptance.py
      - name: Commit acceptance report
        run: |
          git config user.name "NutriFoundation P0.3 Workbench Bot"
          git config user.email "actions@users.noreply.github.com"
          git add runs/E0.4.3/P0.3/P0.3_Workbench_Automated_Implementation_Test_Report_v1.0.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "test(E0.4.3-P0.3-H0): freeze automated workbench acceptance [skip ci]"
            git fetch origin e0.4.3-batch002-independent-gold
            git rebase origin/e0.4.3-batch002-independent-gold
            git push origin HEAD:e0.4.3-batch002-independent-gold
          fi
