name: NutriFoundation Engine CI

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'fixtures/**'
      - 'pyproject.toml'
      - '.github/workflows/engine-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'fixtures/**'
      - 'pyproject.toml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: nutri contract-check
      - run: nutri validate-gold-gate fixtures/Batch001_ScientificClaim_Gold_Registry_v0.1.yaml
