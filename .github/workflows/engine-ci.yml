name: NutriFoundation Engine CI

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'fixtures/**'
      - 'schemas/**'
      - 'paper_c/**'
      - 'pyproject.toml'
      - '.github/workflows/engine-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'fixtures/**'
      - 'schemas/**'
      - 'pyproject.toml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: nutri contract-check
      - run: nutri blind-task-manifest
      - run: nutri validate-gold-gate fixtures/Batch001_ScientificClaim_Gold_Registry_v0.1.yaml
      - run: |
          rm -f /tmp/batch001_replay.db
          nutri replay-batch001             fixtures/Batch001_Verified_SourceArtifact_Registry_v0.1.yaml             --fixture fixtures/pubmed_batch001_articles.json             --db /tmp/batch001_replay.db
      - run: |
          rm -f /tmp/batch001_evidence_replay.db
          nutri replay-evidence-batch001             --source-registry fixtures/Batch001_Verified_SourceArtifact_Registry_v0.1.yaml             --evidence-registry fixtures/Batch001_EvidenceUnit_Frozen_v0.1.yaml             --pubmed-fixture fixtures/pubmed_batch001_articles.json             --db /tmp/batch001_evidence_replay.db
      - run: |
          rm -f /tmp/batch001_blind_replay.db
          rm -f /tmp/Batch001_Blind_Replay_Report.json
          nutri score-blind-batch \
            --source-fixture fixtures/Batch001_Blind_SourceText_v0.1.json \
            --response-dir runs/E0.4/Batch001/responses \
            --hidden-gold fixtures/Batch001_EvidenceUnit_Frozen_v0.1.yaml \
            --db /tmp/batch001_blind_replay.db \
            --report /tmp/Batch001_Blind_Replay_Report.json \
            --blindness-class engineering_blind_current_context_prior_exposure
      - run: nutri calibrate-semantic-equivalence
      - run: nutri calibrate-verifier
      - run: |
          rm -f /tmp/Canonical_Equivalence_Report_v0.1.json
          nutri score-canonical-batch \
            --response-dir runs/E0.4/Batch001/responses \
            --hidden-reference fixtures/Batch001_EvidenceUnit_Frozen_v0.1.yaml \
            --report /tmp/Canonical_Equivalence_Report_v0.1.json \
            --batch-id B001
      - run: nutri validate-strict-blind runs/E0.4/Batch001/responses
