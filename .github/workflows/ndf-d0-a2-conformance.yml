name: NDF D0 A2 Conformance

on:
  push:
    branches:
      - ndf-d0-a2-runtime-conformance
    paths:
      - "src/nutrifoundation/ndf/d0/**"
      - "fixtures/ndf/d0/**"
      - "tests/ndf/test_d0_a2_runtime.py"
      - "scripts/ndf/run_d0_a2_conformance.py"
      - ".github/workflows/ndf-d0-a2-conformance.yml"
  workflow_dispatch:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run existing NDF D0 A2 runtime tests
        run: pytest -q tests/ndf/test_d0_a2_runtime.py
      - name: Generate NDF D0 A2 conformance report
        run: python scripts/ndf/run_d0_a2_conformance.py
