name: R2-P2-A2.8 P4 source LLM channel synthetic conformance
on:
  pull_request:
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -B tests/u3r2p2a2/verify_a28_p4_channels.py
      - run: python -B -m py_compile src/u3r2p2a2/a28_p4_run.py src/u3r2p2a2/a28_p4_run_adapter.py src/u3r2p2a2/a28_p4_join.py src/u3r2p2a2/a28_p4_fetch_weights.py
