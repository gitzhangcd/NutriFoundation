name: R2-P2-A2.6 P0 synthetic score contract
on:
  pull_request:
    paths:
      - 'src/u3r2p2a2/**'
      - 'tests/u3r2p2a2/**'
      - '.github/workflows/udf-r2-p2-a26-p0.yml'
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install jsonschema==4.25.1
      - run: python -B src/u3r2p2a2/a26_score_contract_tests.py
