name: R2-P2-A2.6 P1 synthetic adjudication and import conformance
on:
  pull_request:
    paths:
      - 'src/u3r2p2a2/**'
      - 'tests/u3r2p2a2/**'
      - 'schemas/udf/u3r2/**'
      - '.github/workflows/udf-r2-p2-a26-p1.yml'
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install jsonschema==4.25.1
      - run: python -B -m unittest discover -s tests/u3r2p2a2 -p 'verify_a26_p1*.py'
