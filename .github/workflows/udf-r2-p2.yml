name: R2-P2 portable synthetic conformance
on:
  pull_request:
    paths:
      - 'src/u3r2p2/**'
      - 'tests/u3r2p2/**'
      - '.github/workflows/udf-r2-p2.yml'
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install jsonschema==4.25.1
      - run: python -B tests/u3r2p2/verify_p2_portable_v2.py
