name: WB-EA-P1 original D0 integration regression

on:
  push:
    branches: [workbench-ea-p1-d0-54b4c2e-integration]
  pull_request:
    paths:
      - 'apps/workbench/d0/**'
      - '.github/workflows/wb-ea-p1-d0-integrated.yml'

permissions:
  contents: read

jobs:
  integrated-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original D0 pinned runtime and test tools
        run: |
          python -m pip install --require-hashes -r apps/workbench/d0/requirements.lock
          python -m pip install 'pytest==8.4.2' 'httpx==0.28.1'
      - name: Check source and bytecode syntax
        run: |
          python -m compileall -q apps/workbench/d0
          node --input-type=module --check < apps/workbench/d0/web/reader.js
          node --input-type=module --check < apps/workbench/d0/web/workbench.js
          node --input-type=module --check < apps/workbench/d0/web/ea_mode.js
      - name: Existing D0 + Evidence integration tests
        run: |
          python -m pytest apps/workbench/d0/tests/test_d0.py apps/workbench/d0/tests/test_ea_integrated.py -q -ra
      - name: Scientific upstream and unrelated Workbench non-regression
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e 54b4c2eba844f39c07575573a3e834e0bc00c261^{commit}
          if git diff --name-only 54b4c2eba844f39c07575573a3e834e0bc00c261 HEAD |
            grep -E '^(runs/|src/nutrifoundation/|apps/workbench/c1/|apps/workbench/c2_1/|apps/workbench/c2_2/)'; then
            echo 'FAILED: existing science or controller protected path changed'
            exit 1
          fi
