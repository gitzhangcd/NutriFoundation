name: WB-P1.1-B3 synthetic expert handoff acceptance
on:
  push:
    branches: [workbench-p1.1-b3-expert-assignment-handoff]
  pull_request:
    paths:
      - 'apps/workbench/d0/**'
      - 'docs/workbench/WB-P1.1-B3*'
      - '.github/workflows/wb-p1-1-b3.yml'
permissions:
  contents: read
jobs:
  b3-python:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned D0 dependencies and test suite
        run: |
          python -m pip install --require-hashes -r apps/workbench/d0/requirements.lock
          python -m pip install 'pytest==8.4.2' 'httpx==0.28.1'
      - name: Compile and JavaScript syntax
        run: |
          python -m compileall -q apps/workbench/d0
          node --check apps/workbench/d0/web/tpa_manage.js
          node --check apps/workbench/d0/web/tpa_p11.js
          node --check apps/workbench/d0/web/tpa_b2.js
          node --check apps/workbench/d0/web/tpa_b3.js
      - name: Original D0 plus B1 B2 B3 synthetic security regressions
        run: python -m pytest apps/workbench/d0/tests -q -ra
      - name: Protected scientific authority trees
        run: |
          set -euo pipefail
          if git diff --name-only ed21f9aa1012f2eedb416332b9cfb5da88998ca3 HEAD |
            grep -E '^(runs/|src/nutrifoundation/|apps/workbench/c1/|apps/workbench/c2_1/|apps/workbench/c2_2/|apps/workbench/d0/ea_(runtime|seed|contract))'; then
            echo "B3 unexpectedly changed scientific truth or archived experiment"; exit 1
          fi
  b3-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Original D0 Chromium and PDF.js
        run: |
          python -m pip install --require-hashes -r apps/workbench/d0/requirements.lock
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
          bash apps/workbench/d0/install_pdfjs.sh
      - name: Native B3 synthetic handoff and original reader nonregression
        env:
          D0_QA_OUTPUT: /tmp/b3-browser-results
        run: python apps/workbench/d0/tests/browser_d0.py
      - name: Synthetic screenshots and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b3-browser-results
          path: /tmp/b3-browser-results
          if-no-files-found: ignore
