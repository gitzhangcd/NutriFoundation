name: WB-TPA-P1.1-A synthetic operations & D0 regression
on:
  push:
    branches: [workbench-tpa-p1.1-a-management-ux-spec]
  pull_request:
    paths:
      - 'apps/workbench/d0/**'
      - 'docs/workbench/**'
      - '.github/workflows/wb-tpa-p1-1-a.yml'
permissions:
  contents: read
jobs:
  p11-python:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked synthetic D0 dependencies
        run: |
          python -m pip install --require-hashes -r apps/workbench/d0/requirements.lock
          python -m pip install 'pytest==8.4.2' 'httpx==0.28.1'
      - name: Compile and validate P1.1 source, scripts, contracts
        run: |
          python -m compileall -q apps/workbench/d0
          node --check apps/workbench/d0/web/tpa_manage.js
          node --check apps/workbench/d0/web/tpa_p11.js
          python -m json.tool docs/workbench/contracts/WB-TPA-P0_v0.1.json >/dev/null
      - name: Original D0, EA, TPA plus P1.1 operational tests
        run: |
          python -m pytest apps/workbench/d0/tests/test_d0.py apps/workbench/d0/tests/test_ea_integrated.py apps/workbench/d0/tests/test_tpa_integrated.py apps/workbench/d0/tests/test_tpa_p11.py -q -ra
      - name: Frozen science and original NDS boundaries
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e 54b4c2eba844f39c07575573a3e834e0bc00c261^{commit}
          if git diff --name-only 54b4c2eba844f39c07575573a3e834e0bc00c261 HEAD |
            grep -E '^(runs/|src/nutrifoundation/|apps/workbench/c1/|apps/workbench/c2_1/|apps/workbench/c2_2/)'; then
            echo 'Protected scientific authority modified'; exit 1
          fi
  p11-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium and locked runtime
        run: |
          python -m pip install --require-hashes -r apps/workbench/d0/requirements.lock
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
          bash apps/workbench/d0/install_pdfjs.sh
      - name: Original D0 browser + P1.1 project/batch management
        env:
          D0_QA_OUTPUT: /tmp/p11-browser-results
        run: python apps/workbench/d0/tests/browser_d0.py
      - name: Browser results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p11-browser-results
          path: /tmp/p11-browser-results
          if-no-files-found: ignore
