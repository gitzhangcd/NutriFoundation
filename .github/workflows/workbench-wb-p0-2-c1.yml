name: Workbench WB-P0.2-C1 Durable Draft + PDF.js
on:
  push:
    branches: [workbench-wb-p0.2-real-paper-roundtrip]
    paths:
      - 'apps/workbench/c1/**'
      - '.github/workflows/workbench-wb-p0-2-c1.yml'
  workflow_dispatch:
jobs:
  reader-draft-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/workbench/c1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install pinned local PDF.js assets
        run: bash install_pdfjs.sh
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Unit and API regressions (11 contracts)
        run: PYTHONPATH=. python -m pytest tests/test_c1.py -q
      - name: True native PDF.js, real-paper anchor and durable draft E2E
        run: PYTHONPATH=. python tests/browser_c1_native.py
      - name: Screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wb-p0-2-c1-native-pdfjs
          path: apps/workbench/c1/screenshots/04-native-pdfjs-c1.png
          if-no-files-found: ignore