  - evidence_id: EU-B001-003
    source_id: SA-B001-003
    population: "Nondiabetic adults at high risk for type 2 diabetes with elevated fasting and post-load glucose"
    intervention: "Intensive lifestyle modification"
    comparator: "Placebo"
    outcome: "Incident type 2 diabetes"
    effect_summary: "Diabetes incidence was 4.8 vs 11.0 cases per 100 person-years for lifestyle vs placebo; lifestyle reduced incidence by 58% (95% CI 48%-66%)."
