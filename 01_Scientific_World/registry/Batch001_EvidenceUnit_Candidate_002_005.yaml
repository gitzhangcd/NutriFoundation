  - evidence_id: EU-B001-004
    source_id: SA-B001-004
    population: "Adults aged 55-80 at high cardiovascular risk without cardiovascular disease at enrollment"
    intervention: "Mediterranean diet plus extra-virgin olive oil OR Mediterranean diet plus mixed nuts"
    comparator: "Advice to reduce dietary fat"
    outcome: "Major cardiovascular event: myocardial infarction, stroke, or cardiovascular death"
    effect_summary: "Adjusted hazard ratio was 0.69 (95% CI 0.53-0.91) for Mediterranean diet plus extra-virgin olive oil and 0.72 (95% CI 0.54-0.95) for Mediterranean diet plus nuts vs control."
    follow_up: "Median 4.8 years"
    source_span_type: PubMed_abstract
    applicability_boundary: "Primary prevention in a high-cardiovascular-risk Spanish population; corrected report explicitly accounts for identified randomization/protocol deviations."
    status: verified_candidate

  - evidence_id: EU-B001-005
    source_id: SA-B001-005
    population: "Overweight or obese adults with type 2 diabetes"
    intervention: "Intensive lifestyle intervention for weight loss"
    comparator: "Diabetes support and education"
    outcome: "Composite cardiovascular morbidity/mortality"
    effect_summary: "Despite greater sustained weight loss and risk-factor improvements, the primary cardiovascular outcome was not reduced: HR 0.95 (95% CI 0.83-1.09), P=0.51."
    follow_up: "Median 9.6 years at early stopping for futility"
    source_span_type: PubMed_abstract
    applicability_boundary: "Supports a distinction between weight/risk-factor improvement and proven cardiovascular-event reduction."
    status: verified_candidate
