  - evidence_id: EU-B001-010
    source_id: SA-B001-010
    status: frozen_F0
    population: "Adults aged 20-65 with T2D diagnosed within 6 years, BMI 27-45, not receiving insulin"
    intervention: "Primary-care multicomponent weight-management program"
    comparator: "Best-practice guideline care"
    outcome: ">=15 kg weight loss and diabetes remission at 12 months"
    effect: ">=15 kg loss 24% vs 0%; remission 46% vs 4%, OR 19.7 (95% CI 7.8-49.8)"
    applicability_boundary: "Multicomponent program includes total diet replacement, food reintroduction, maintenance support, and medication withdrawal; cannot attribute effect to diet alone"
