freeze_policy:
  F0:
    meaning: "Agent-verified, source-linked factual extraction or source-stated recommendation directly supported by PubMed abstract/metadata or explicitly retrieved full text."
    human_review_required: false
    may_generate_recommendation: false
    may_be_treated_as_expert_gold: false
  F1:
    meaning: "Full-text anchored scientific evidence object with critical methodological fields checked."
    human_or_expert_review_required_for_critical_fields: true
  GOLD:
    meaning: "ScientificClaim/DecisionEpisode gold used for publication-level benchmark truth."
    independent_human_or_expert_review_required: true

requirements:
  required_source_reference: true
  required_source_span: true
  provenance_required: true
  applicability_boundary_required: true
  observational_causality_guard: true
  guideline_authority_guard: true
