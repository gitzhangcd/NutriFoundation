evidence_id: EU-B001-001
source_id: SA-B001-001
status: verified_candidate
population:
  description: "215 overweight adults with newly diagnosed type 2 diabetes, never treated with antihyperglycemic drugs"
intervention:
  description: "Low-carbohydrate Mediterranean-style diet (<50% daily calories from carbohydrates)"
comparator:
  description: "Low-fat diet (<30% daily calories from fat)"
outcome:
  primary: "Protocol-defined initiation of antihyperglycemic drug therapy"
  secondary:
    - "Weight change"
    - "Glycemic control"
    - "Coronary risk factors"
effect:
  summary: "After 4 years, 44% in the Mediterranean-style diet group vs 70% in the low-fat group required antihyperglycemic therapy; absolute difference -26.0 percentage points; HR 0.63 (95% CI 0.51-0.86)."
follow_up: "4 years"
limitations:
  - "Investigators responsible for initiating drug therapy were not blinded"
  - "Dietary intake was self-reported"
source_span:
  type: PubMed_abstract
  url: "https://pubmed.ncbi.nlm.nih.gov/19721018/"
applicability_boundary: "Overweight adults with newly diagnosed, drug-naive type 2 diabetes; should not be generalized to advanced or insulin-treated diabetes without separate evidence."
verification:
  metadata: verified
  population_intervention_comparator_outcome: verified
  numeric_effect: verified
