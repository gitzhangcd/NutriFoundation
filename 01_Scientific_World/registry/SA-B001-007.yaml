  outcome: "2-year body-weight change"
  effect_summary: "At 2 years, weight loss was 3.0 vs 3.6 kg for 15% vs 25% protein, 3.3 kg for both 20% vs 40% fat, and 2.9 vs 3.4 kg for 65% vs 35% carbohydrate; P>0.20 for all comparisons. Lipid-related risk factors and fasting insulin improved."
