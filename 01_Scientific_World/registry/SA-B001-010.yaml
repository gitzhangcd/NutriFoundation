source_artifact:
  source_id: SA-B001-010
  title: "Primary care-led weight management for remission of type 2 diabetes (DiRECT): an open-label, cluster-randomised trial."
  journal: "Lancet"
  year: 2018
  pmid: "29221645"
  doi: "10.1016/S0140-6736(17)33102-1"
  source_type: cluster_randomized_trial
  population: "306 adults aged 20-65 with type 2 diabetes diagnosed within 6 years, BMI 27-45, not receiving insulin"
  intervention: "Primary-care weight-management program with total diet replacement, food reintroduction, and maintenance support"
  comparator: "Best-practice guideline care"
  provenance_url: "https://pubmed.ncbi.nlm.nih.gov/29221645/"
  verification_status: verified_pubmed_abstract
evidence_unit_candidate:
  evidence_id: EU-B001-010
  population: "Adults with relatively recent type 2 diabetes, BMI 27-45, not receiving insulin"
  intervention: "Intensive weight-management program"
  comparator: "Best-practice care"
  outcome: "12-month >=15 kg weight loss and diabetes remission"
  effect_summary: "At 12 months, >=15 kg weight loss occurred in 24% vs 0%; diabetes remission occurred in 46% vs 4% (OR 19.7, 95% CI 7.8-49.8). Mean bodyweight change was -10.0 kg vs -1.0 kg."
  source_span_type: abstract
  limitation: "Open-label cluster-randomized design; intervention is multicomponent and includes medication withdrawal, so effects cannot be attributed to diet alone."
  status: verified_candidate
