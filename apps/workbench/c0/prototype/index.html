<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Workbench C0 | Interactive Design Prototype</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1d2a38;background:#f4f7fa}*{box-sizing:border-box}body{margin:0}button,select,input,textarea{font:inherit}button{cursor:pointer}header{height:70px;background:#fff;border-bottom:1px solid #e0e7ef;display:flex;justify-content:space-between;align-items:center;padding:0 28px}.brand{font-size:23px;font-weight:800;color:#183d63}.pill{border-radius:999px;padding:7px 12px;background:#eaf2fb;color:#245785;font-size:12px;font-weight:700}#app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 70px)}aside{background:#fff;border-right:1px solid #e0e7ef;padding:25px 15px}nav button{width:100%;display:block;text-align:left;padding:12px 14px;margin:4px 0;border:0;border-radius:9px;background:transparent;color:#475c72}nav button.active{background:#eaf2fb;color:#145b97;font-weight:700}main{padding:26px 30px}.sub{color:#708298;font-size:13px}.heading{font-size:27px;font-weight:780;margin:0 0 8px}.surface{background:#fff;border:1px solid #e3e9ef;border-radius:14px;box-shadow:0 3px 18px #22395209}.tasks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:24px}.task{border:1px solid #dce5ee;background:white;text-align:left;padding:20px;border-radius:12px;min-height:148px}.task:hover{border-color:#8baed0;box-shadow:0 4px 16px #2c5f8b19}.task strong{display:block;margin:12px 0}.task span{font-size:12px;color:#60748c}.workspace{display:grid;grid-template-columns:minmax(300px,1.1fr) minmax(390px,1.25fr) 255px;gap:14px;margin-top:20px;min-height:660px}.pane{padding:19px;overflow:auto}.pane h3{font-size:16px;margin:0 0 14px}.paper p{line-height:1.75;font-size:14px;color:#34495b}.paper .quote{background:#fff1bd;padding:2px}.block{border:1px solid #e4e9ee;padding:13px;border-radius:9px;margin:12px 0}.step{border:1px solid #e3e9ee;border-radius:9px;margin:10px 0;padding:12px;cursor:pointer}.step.open{border-color:#9cc2e3;background:#f5faff}.step h4{margin:0 0 6px}.label{display:block;font-size:13px;font-weight:700;margin:12px 0 7px}textarea,input,select{border:1px solid #d2dee9;border-radius:8px;padding:10px;background:#fff;color:#253d55;width:100%}textarea{min-height:98px;resize:vertical}.actions{display:flex;gap:8px;margin:15px 0;flex-wrap:wrap}.primary{background:#1d6097;color:#fff;border:0;border-radius:8px;padding:10px 16px}.secondary{background:#fff;color:#1d6097;border:1px solid #a8c4dc;border-radius:8px;padding:10px 16px}.disabled{opacity:.45;cursor:not-allowed}.warn{background:#fff8e9;border:1px solid #f1dea6;color:#755a25;padding:13px;border-radius:10px;font-size:13px}.success{background:#e9f8ee;border:1px solid #c6e9cf;color:#1d653b;padding:12px;border-radius:10px;font-size:13px}.danger{background:#fff1f0;border:1px solid #ffd1cb;color:#9b3b33;padding:12px;border-radius:10px;font-size:13px}.anchor{background:#f1f6fc;color:#174d80;padding:9px 10px;border-radius:8px;font-size:12px;margin:8px 0}.muted{color:#74899e}.toprow{display:flex;justify-content:space-between;gap:12px;align-items:center}.tiny{font-size:11px}.hidden{display:none!important}@media(max-width:1100px){#app{grid-template-columns:75px 1fr}aside{padding:15px 6px}aside nav button{font-size:0}aside nav button:before{content:'•';font-size:17px}.workspace{grid-template-columns:1fr}.tasks{grid-template-columns:1fr 1fr}}
</style></head><body><header><div class="brand">◉ Workbench <span class="sub">/ Expert Research Workspace</span></div><div><span class="pill">C0 · 仅交互原型 / SYNTHETIC</span></div></header><div id="app"><aside><div class="sub" style="padding:0 13px 16px">NUTRIFOUNDATION</div><nav><button id="navtasks" class="active" onclick="route('tasks')">▦ 我的任务</button><button id="navsources" onclick="route('sources')">▤ 来源库</button><button id="navaudit" onclick="route('audit')">◷ 审计说明</button><button id="navconfig" onclick="route('config')">⚙ Profile 配置</button></nav><p class="sub" style="padding:20px 12px">仅浏览器内合成数据；不连接真实专家身份、锁定或 NDS 科学数据。</p></aside><main id="view"></main></div><script>
const tasks=[{id:'DEMO-R0-001',arm:'R0',phase:'draft',name:'独立专业判断',status:'草稿',hasCandidate:false},{id:'DEMO-R1-HOLD',arm:'R1',phase:'hold',name:'Agent-first 验证（待候选冻结）',status:'等待条件',hasCandidate:false},{id:'DEMO-R1-VERIFY',arm:'R1',phase:'verify',name:'Agent-first 候选核查',status:'合成候选已冻结',hasCandidate:true},{id:'DEMO-R2-PRE',arm:'R2',phase:'pre',name:'Pre-AI 独立判断',status:'尚未锁定',hasCandidate:false},{id:'DEMO-R2-POST',arm:'R2',phase:'post',name:'Pre-AI 锁定后协调',status:'合成快照已冻结',hasCandidate:true}];
let current=null, stage=0, screen='tasks', drafts={}, anchors={}, exposureLog=[];
const steps=[['事实与焦点','请说明本案例的核心决策问题与已观察到的事实。','decision_focus'],['缺失信息','哪些缺失信息会改变后续判断？','decision_changing_missing_information'],['行动与边界','有哪些当前可接受或条件性的行动？','currently_acceptable_actions'],['随访与不确定性','需要哪些监测？目前有何不确定性？','uncertainty_notes'],['检查与提交','请复核完整判断、来源及暴露声明。','rationale_notes']];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function route(v){screen=v;current=null;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.id==='nav'+v));render()}
function openTask(id){current=tasks.find(t=>t.id===id);screen='workspace';stage=0;render()}
function saveField(key,v){if(!current)return;drafts[current.id]??={};drafts[current.id][key]=v;const s=document.querySelector('#savestate');if(s)s.textContent='已保存（仅此浏览器会话）'}
function addAnchor(){if(!current)return;anchors[current.id]??=[];anchors[current.id].push({id:'SYNTH-ANCHOR-'+(anchors[current.id].length+1),source:'SYNTH-HUMAN-PACKET',status:'PAGE_HINT_ONLY'});render()}
function selectStage(n){stage=n;render()}
function requestForbidden(){const p=document.getElementById('guard');if(p)p.innerHTML='<div class="danger">拒绝：当前协议阶段无权访问 Agent 内容。本原型未下载或隐藏任何候选字节。</div>'}
function revealCandidate(){if(!current||!current.hasCandidate)return requestForbidden();exposureLog.push({task:current.id,kind:'SIMULATED_EXPOSURE',at:new Date().toISOString()});const p=document.getElementById('guard');if(p)p.innerHTML='<div class="success">模拟暴露记录已添加。本 UI 仅演示允许视图，不是服务器事务，也不是科学合法的曝光证明。</div><div class="block"><strong>合成 Agent 候选</strong><p>请核查是否缺失决策所需的关键信息。</p><label class="label">Disposition</label><select><option>ACCEPT</option><option>REJECT</option><option>MODIFY</option><option>IRRELEVANT</option><option>UNCERTAIN</option><option>NEEDS_MORE_EVIDENCE</option></select></div>'}
function render(){const el=document.getElementById('view');if(screen==='tasks'){el.innerHTML='<h1 class="heading">专家任务中心</h1><p class="sub">所有案例均为虚构的 UI 测试夹具；R0/R1/R2 可见数据因阶段而不同。</p><div class="tasks">'+tasks.map(t=>`<button class="task" onclick="openTask('${t.id}')"><span>${t.id} · ${t.arm}</span><strong>${t.name}</strong><span>${t.status} · 查看流程</span></button>`).join('')+'</div><p class="warn" style="margin-top:24px">正式专家资格、任务分配、Pre-AI Lock 和真实科学提交在 C0 均不可用。所有“锁定”按钮仅展示设计确认流程。</p>';return}
if(screen!=='workspace'){const names={sources:['来源库 / Import','这里应导入具备完整原件、SHA-256 与 Manifest 的 AnnotationSourcePackage；导入来源不意味着专家任务已获准阅读。'],audit:['审计与数据导出','正式审计必须来自服务器端 append-only 事件与不可变快照；本原型仅保留会话内模拟事件。'],config:['Task Profile 管理','Evidence Annotation 与 Expert Decision Capture 是不同可版本化 Profile；页面渲染不能定义科学真值。']};let z=names[screen]||names.config;el.innerHTML=`<h1 class="heading">${z[0]}</h1><div class="surface" style="padding:24px;margin-top:18px">${z[1]}</div>`;return}
const t=current;if(!t){route('tasks');return}const isHold=t.phase==='hold',isPre=t.arm==='R2'&&t.phase==='pre',isR0=t.arm==='R0',isPost=t.phase==='post';const d=drafts[t.id]||{};
let center;if(isHold)center='<div class="warn"><strong>R1 入口保持锁定</strong><p>AgentCandidateSet 尚未冻结，不能提前开放核查。R1 不是先填写 J_preAI 再查看候选的流程。</p></div>';
else if(t.phase==='verify')center='<div class="block"><strong>R1 专家验证</strong><p>只有冻结候选和源文本片段全部就绪后才能正式开放（此处为模拟 fixture）。</p><button class="primary" onclick="revealCandidate()">查看合成候选与来源</button><div id="guard"></div></div>';
else if(isPost)center='<div class="block"><strong>R2 已冻结 J_preAI（合成只读）</strong><p>先前提交的专家判断不能被更改；对比结果应创建单独 J_postAI。</p><button class="primary" onclick="revealCandidate()">打开合成候选对比</button><div id="guard"></div></div>';
else center='<div class="sub">自然专业问句呈现，映射到既有 NDS-R1 字段；允许未知、多个可接受方案。</div>'+steps.map((s,i)=>`<div class="step ${i===stage?'open':''}" onclick="selectStage(${i})"><h4>0${i+1} · ${s[0]}</h4>${i===stage?`<p class="sub">${s[1]}</p><textarea aria-label="${s[2]}" onclick="event.stopPropagation()" oninput="saveField('${s[2]}',this.value)" placeholder="填写专业判断；不能从缺失数据推断科学事实">${esc(d[s[2]]||'')}</textarea><div class="actions"><button class="secondary" onclick="event.stopPropagation();saveField('${s[2]}',document.querySelector('[aria-label=${s[2]}]').value)">保存草稿</button>${i<4?`<button class="primary" onclick="event.stopPropagation();selectStage(${i+1})">下一阶段 →</button>`:''}</div>`:''}</div>`).join('')+'<div class="warn">本原型仅会话内模拟草稿，不会实际创建科学 J_preAI 或 FreezeReceipt。</div>';
el.innerHTML=`<div class="toprow"><div><a href="#" class="sub" onclick="event.preventDefault();route('tasks')">← 我的任务</a><h1 class="heading" style="margin-top:9px">${t.name}</h1><div class="sub">${t.id} · ${t.arm} · SYNTH-CASE · 输入表面仅为模拟</div></div><span class="pill">${t.status}</span></div><div class="workspace"><section class="surface pane paper"><h3>阅读原始证据</h3><p class="sub">SYNTH-HUMAN-PACKET / 演示材料（非真实论文）</p><div class="block"><strong>Case observations (synthetic)</strong><p>一位虚构研究参与者的饮食信息尚不完整。需要核查哪些信息会影响专业营养决策。</p><p><span class="quote">缺失膳食摄入信息时，不应默认全部资料正常或已经收集。</span></p></div><div class="actions"><button class="secondary" onclick="addAnchor()">+ 选择并绑定模拟锚点</button><button class="secondary" onclick="alert('C0 无正式原件；PDF.js 精准回跳由 B1 工程实现提供，不在本合成任务伪造')">查看原始 PDF（需真实授权来源）</button></div><div class="sub">精准源文阅读器将从 WB-P0.2-B1 组件集成，C0 不伪造 PDF BBox。</div></section><section class="surface pane"><h3>${t.arm==='R1'?'AgentFirst 验证界面':isPost?'判断对比与协调':'专家分阶段判断'}</h3><div id="savestate" class="sub" style="margin-bottom:14px">未提交 · C0 本地演示</div>${center}</section><section class="surface pane"><h3>证据 / 任务状态</h3><div class="sub">允许的最小化工作信息</div><div class="block"><strong>${t.arm} 科学流程</strong><p class="sub">${isR0?'永久不开放 Agent 候选':isHold?'仅待冻结候选':isPre?'独立判断阶段 · 任何 Agent 内容不可见':isPost?'冻结后对比': 'Agent-first 候选验证'}</p></div><h3 style="margin-top:23px">当前锚点</h3>${(anchors[t.id]||[]).map(a=>`<div class="anchor">${a.id}<br>${a.status}</div>`).join('')||'<p class="sub">尚无锚点</p>'}<div id="guard"></div>${isPre?'<button class="secondary" onclick="requestForbidden()">测试未授权访问（应拒绝）</button>':''}</section></div>`}
render();</script></body></html>
